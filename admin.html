<!doctype html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>管理者後台｜股聞日曆</title>
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:#172033;background:#f2f5f9}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:.65rem 1rem;background:#175bd6;color:white;font-weight:650}button:disabled{opacity:.5}a{color:#175bd6}header{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:1rem max(1rem,calc((100% - 1100px)/2));background:#10213f;color:white}header h1{font-size:1.25rem;margin:0 0 .2rem}header a{color:#cfe0ff}header button{background:#30476d}main{max-width:1100px;margin:1.4rem auto;padding:0 1rem;display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,.9fr);gap:1rem}.panel,.login{background:white;border:1px solid #dce3ed;border-radius:14px;padding:1.2rem;box-shadow:0 5px 20px #1720330c}.panel h2{margin-top:0}.panel p,small{color:#667085}.login{display:block;max-width:420px;margin:12vh auto;padding:1.5rem}.login label{display:grid;gap:.35rem;margin:1rem 0;font-weight:600}.login input,#user-search{border:1px solid #bcc7d5;border-radius:8px;padding:.7rem;background:white;color:#172033}.login button{width:100%}.login a{display:block;text-align:center;margin-top:1rem}.login [role=alert]{color:#b42318}.children{margin:.2rem 0 .5rem 1.2rem;border-left:2px solid #e5eaf1;padding-left:.8rem}.feature{display:flex;align-items:center;gap:.55rem;padding:.55rem .2rem;cursor:pointer}details summary{cursor:pointer;font-weight:700;padding:.5rem 0}.feature input,summary input,.user-editor input{width:18px;height:18px;accent-color:#175bd6}.user-list{max-height:320px;overflow:auto;border:1px solid #e1e6ef;border-radius:10px;margin-top:.7rem}.user{width:100%;display:grid;grid-template-columns:1fr auto;text-align:left;border-radius:0;background:white;color:#172033;border-bottom:1px solid #edf0f5}.user small{grid-column:1/3}.user span{font-size:.8rem;color:#667085}.user.selected{background:#eef4ff}.user-editor{margin-top:1rem;padding-top:1rem;border-top:1px solid #e1e6ef}.status{grid-column:1/-1;color:#18794e}@media(max-width:760px){main{grid-template-columns:1fr;margin:.7rem auto}header{padding:.8rem 1rem}.user-list{max-height:260px}}
</style></head><body><div id="app"></div><script type="module" src="./src/admin.js"></script></body></html>
