name: Update Value Chains
on:
  schedule:
    - cron: '30 2 1 * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: value-chain-catalog
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/sync_value_chains.py
      - name: Save official classification snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/value-chains.json
          git diff --cached --quiet && exit 0
          git commit -m 'Update official TPEx value-chain classifications'
          git pull --rebase origin main
          git push origin HEAD:main
