name: Update Substack articles
on:
  push:
    branches: [main]
    paths: [scripts/sync_substack.py, worker/substack.js, .github/workflows/substack.yml]
  schedule:
    # 06:20 and 18:20 Asia/Taipei; actual start depends on GitHub scheduling.
    - cron: '20 22,10 * * *'
  workflow_dispatch:
    inputs:
      author_id:
        description: Prioritize this publication; remaining authors are also processed
        type: string
        default: ''
      continuation:
        description: Automatically resume remaining historical archives
        type: boolean
        default: false
permissions:
  contents: read
  actions: write
concurrency:
  group: substack-import
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WORKER_API_URL: ${{ vars.WORKER_API_URL }}
      COLLECTOR_SECRET: ${{ secrets.COLLECTOR_SECRET }}
      SUBSTACK_AUTHOR_ID: ${{ inputs.author_id }}
      SUBSTACK_CONTINUATION: ${{ inputs.continuation }}
      SUBSTACK_WORKFLOW_REF: ${{ github.ref_name }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Import public posts and resume historical archive
        run: python scripts/sync_substack.py
