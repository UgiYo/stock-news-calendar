name: Check live article reader
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/check-article-reader.yml
      - scripts/check_article_reader.mjs
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/check_article_reader.mjs
