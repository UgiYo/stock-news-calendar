name: Update Podcast RSS
on:
  push:
    branches: [main]
    paths: [.github/workflows/podcasts.yml, scripts/sync_podcasts.py]
  schedule:
    # 10:00 UTC = 18:00 Asia/Taipei. GitHub may start scheduled runs late.
    - cron: '0 10 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: podcast-rss
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch latest Podcast RSS
        run: python scripts/sync_podcasts.py
      - name: Save shared episode metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/podcasts/*.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update shared Podcast RSS metadata"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
