name: Update podcast episodes
on:
  schedule:
    - cron: '0 14 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/podcasts.yml'
      - 'scripts/sync_podcasts.py'
permissions:
  contents: write
  actions: write
concurrency:
  group: podcast-episodes
  cancel-in-progress: false
jobs:
  podcast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/sync_podcasts.py
      - name: Retain shared bounded episode metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/podcasts/zhaohua.json
          if ! git diff --cached --quiet; then
            git commit -m "Update podcast episode metadata"
            git push origin HEAD:main
          fi
      - name: Deploy updated calendar data
        run: gh workflow run pages.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
