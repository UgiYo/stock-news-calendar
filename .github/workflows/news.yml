name: Update company news
on:
  schedule:
    - cron: '17 22 * * *'
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [queued, daily]
        default: queued
permissions:
  contents: read
concurrency:
  group: news-collector
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      WORKER_API_URL: ${{ vars.WORKER_API_URL }}
      COLLECTOR_SECRET: ${{ secrets.COLLECTOR_SECRET }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SUMMARY_MODEL: ${{ vars.SUMMARY_MODEL }}
      RUN_MODE: ${{ github.event_name == 'schedule' && 'daily' || inputs.mode }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - name: Sync official company catalog
        if: env.RUN_MODE == 'daily'
        run: python scripts/sync_catalog.py
      - name: Collect news and process queued summaries
        run: python scripts/collect.py
