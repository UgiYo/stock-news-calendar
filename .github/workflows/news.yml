name: Update company news
on:
  schedule:
    # GitHub cron uses UTC: Taiwan 06:17 primary, 07:17 and 08:17 recovery.
    - cron: '17 22 * * *'
    - cron: '17 23 * * *'
    - cron: '17 0 * * *'
  # Validate schedule configuration changes immediately with a full daily collection.
  push:
    branches: [main]
    paths:
      - '.github/workflows/news.yml'
      - 'scripts/news_schedule_guard.py'
      - 'scripts/collect.py'
      - '.automation/news-daily.json'
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [queued, daily]
        default: queued
permissions:
  contents: read
  actions: read
env:
  WORKER_API_URL: ${{ vars.WORKER_API_URL }}
  COLLECTOR_SECRET: ${{ secrets.COLLECTOR_SECRET }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  SUMMARY_MODEL: ${{ vars.SUMMARY_MODEL }}
  RUN_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'daily' }}
jobs:
  update:
    concurrency:
      group: news-daily-collection
      cancel-in-progress: false
    outputs:
      run_news: ${{ steps.guard.outputs.run_news }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Test schedule recovery and quota handling
        run: |
          python3 -m unittest discover -s tests -p 'test_news_schedule_guard.py' -v
          python3 -m unittest discover -s tests -p 'test_collect_quota.py' -v
      - name: Check whether daily news already succeeded
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          EXTERNAL_NEWS_TRIGGER: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[news-daily-trigger]') }}
        run: python3 scripts/news_schedule_guard.py
      - name: Validate collector configuration
        if: steps.guard.outputs.run_news == 'true'
        run: |
          python3 - <<'PY'
          import os
          from urllib.parse import urlparse
          required = ['WORKER_API_URL', 'COLLECTOR_SECRET']
          missing = [key for key in required if not os.environ.get(key)]
          if missing:
              raise SystemExit('Missing configuration: ' + ', '.join(missing))
          url = urlparse(os.environ['WORKER_API_URL'])
          if url.scheme != 'https' or not url.hostname or url.username or url.password:
              raise SystemExit('WORKER_API_URL must be a valid HTTPS URL')
          PY
      - uses: actions/setup-python@v5
        if: steps.guard.outputs.run_news == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - name: Install collector dependencies
        id: dependencies
        if: steps.guard.outputs.run_news == 'true'
        run: pip install -r scripts/requirements.txt
      # Prioritize news; background AI/audio preparation must not block daily collection.
      - name: Collect news and process queued summaries
        if: steps.guard.outputs.run_news == 'true'
        run: python scripts/collect.py
      - name: Report news update failure
        if: failure()
        run: |
          echo '::error::News collection failed. Later recovery schedules will retry unless collection already succeeded.'
          echo 'News collection failed. Check the failed step before assuming news was updated.' >> "$GITHUB_STEP_SUMMARY"
  maintenance:
    name: Shared prices and personal background tasks
    needs: update
    if: needs.update.result == 'success' && needs.update.outputs.run_news == 'true'
    # Preserve serialization with earlier workflow versions and queued maintenance.
    concurrency:
      group: news-collector
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - name: Install maintenance dependencies
        id: dependencies
        run: pip install -r scripts/requirements.txt
      - name: Update shared daily stock prices
        run: python scripts/market_prices.py
      - name: Sync official company catalog
        if: always() && steps.dependencies.outcome == 'success' && env.RUN_MODE == 'daily'
        continue-on-error: true
        run: python scripts/sync_catalog.py
      - name: Ensure audio tools for background transcription
        if: always() && steps.dependencies.outcome == 'success'
        id: audio
        run: command -v ffmpeg >/dev/null || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: Process personal background AI tasks
        if: always() && steps.audio.outcome == 'success'
        run: python scripts/personal_ai_jobs.py
