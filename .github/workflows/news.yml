name: Update company news
on:
  schedule:
    - cron: '17 22 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: news-collector
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      COLLECTOR_SECRET: ${{ secrets.COLLECTOR_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sync official company catalog
        run: python scripts/sync_catalog.py
      - name: Collect tracked companies
        if: ${{ !cancelled() }}
        run: python scripts/collect.py
