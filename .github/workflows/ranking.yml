name: Update daily turnover ranking

on:
  schedule:
    # 12:00 UTC = 20:00 Asia/Taipei. Run after the Taiwan market data is available.
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: turnover-ranking
  cancel-in-progress: false

jobs:
  ranking:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WORKER_API_URL: ${{ vars.WORKER_API_URL }}
      COLLECTOR_SECRET: ${{ secrets.COLLECTOR_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - name: Update daily turnover ranking and industry tags
        run: python scripts/ranking.py
