name: Update daily turnover ranking

on:
  push:
    branches: [main]
    paths: [.github/workflows/ranking.yml, scripts/repair_rankings.py]
  schedule:
    # 12:00 UTC = 20:00 Asia/Taipei. Run after the Taiwan market data is available.
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: turnover-ranking
  cancel-in-progress: false

jobs:
  ranking:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WORKER_API_URL: ${{ vars.WORKER_API_URL }}
      COLLECTOR_SECRET: ${{ secrets.COLLECTOR_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - name: Update daily turnover ranking and industry tags
        run: python scripts/ranking.py
      - name: Audit and repair preceding trading-day snapshots
        if: always()
        run: |
          python - <<'PY'
          import sys,time
          sys.path.insert(0,'scripts')
          from collect import api
          for attempt in range(30):
              try:
                  api('/admin/ranking-audit')
                  break
              except Exception:
                  if attempt == 29: raise
                  time.sleep(10)
          from repair_rankings import repair
          repair()
          PY

      - name: Fill daily candlesticks for ranking stocks
        if: always()
        run: python scripts/market_prices.py
