name: Verify Substack import fix
on:
  pull_request:
    paths:
      - 'scripts/sync_substack.py'
      - 'worker/substack.js'
      - 'tests/test_substack_sync.py'
      - 'tests/substack.test.js'
      - '.github/workflows/verify-substack-import.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m unittest discover -s tests -p 'test_substack_sync.py'
      - run: node --test tests/substack.test.js
      - run: node --check worker/substack.js
      - run: python -m py_compile scripts/sync_substack.py
