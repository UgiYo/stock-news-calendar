name: Check Substack saved import
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_substack_import.py
        env:
          WORKER_API_URL: ${{ vars.WORKER_API_URL }}
          COLLECTOR_SECRET: ${{ secrets.COLLECTOR_SECRET }}
