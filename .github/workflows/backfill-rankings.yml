name: Backfill turnover rankings
on:
  push:
    branches: [main]
    paths: [.github/workflows/backfill-rankings.yml]
  workflow_dispatch:
    inputs:
      month:
        description: 'Completed month YYYY-MM (blank = previous month)'
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: news-collector
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      WORKER_API_URL: ${{ vars.WORKER_API_URL }}
      COLLECTOR_SECRET: ${{ secrets.COLLECTOR_SECRET }}
      BACKFILL_MONTH: ${{ inputs.month }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests==2.32.5
      - name: Backfill previous month and baseline trading day
        run: python scripts/backfill_rankings.py
